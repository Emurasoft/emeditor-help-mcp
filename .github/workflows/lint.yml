name: Lint
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install deps
        run: bun ci

      - name: Lint
        run: bun run lint

      - name: Run Oxfmt
        run: bun fmt:check
