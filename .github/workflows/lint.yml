name: Lint
on:
  pull_request:
  push:
    branches: [main]

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install corepack
        run: npm install -g corepack

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '25.6'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Oxlint
        run: yarn lint